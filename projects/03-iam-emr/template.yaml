AWSTemplateFormatVersion: 2010-09-09
Description: >-
  AWS CloudFormation IAM Role Template for EMR Serverless (Common Role)

Metadata:
  Version: 0.0.1

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name (dev, staging, or prod)

Resources:
  # Common IAM Role for EMR Serverless (shared across all EMR apps)
  EMRServerlessExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Env}-miketriky-common-emr-serverless-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - emr-serverless.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Tags:
        - Key: Name
          Value: !Sub '${Env}-miketriky-common-emr-serverless-role'
        - Key: Environment
          Value: !Ref Env

  # Policy for S3 Access (Read Parquet, Write Iceberg)
  EMRServerlessS3Policy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${Env}-miketriky-emr-s3-policy'
      Roles:
        - !Ref EMRServerlessExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadFromMWAABucket
            Effect: Allow
            Action:
              - 's3:GetObject'
              - 's3:ListBucket'
            Resource:
              - !Sub
                - 'arn:aws:s3:::${BucketName}'
                - BucketName:
                    Fn::ImportValue: !Sub '${Env}-miketriky-mwaa-bucket-name'
              - !Sub
                - 'arn:aws:s3:::${BucketName}/*'
                - BucketName:
                    Fn::ImportValue: !Sub '${Env}-miketriky-mwaa-bucket-name'
          - Sid: ReadWriteDataBucket
            Effect: Allow
            Action:
              - 's3:GetObject'
              - 's3:PutObject'
              - 's3:DeleteObject'
              - 's3:ListBucket'
            Resource:
              - !Sub 'arn:aws:s3:::${Env}-miketriky-datalake-*'
              - !Sub 'arn:aws:s3:::${Env}-miketriky-datalake-*/*'

  # Policy for Glue Data Catalog Access (Iceberg tables)
  EMRServerlessGluePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${Env}-miketriky-emr-glue-policy'
      Roles:
        - !Ref EMRServerlessExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: GlueCatalogAccess
            Effect: Allow
            Action:
              - 'glue:GetDatabase'
              - 'glue:GetDatabases'
              - 'glue:GetTable'
              - 'glue:GetTables'
              - 'glue:GetPartition'
              - 'glue:GetPartitions'
              - 'glue:CreateTable'
              - 'glue:UpdateTable'
              - 'glue:DeleteTable'
              - 'glue:BatchCreatePartition'
              - 'glue:BatchDeletePartition'
              - 'glue:BatchUpdatePartition'
            Resource:
              - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog'
              - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/*'
              - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/*/*'

  # Policy for CloudWatch Logs
  EMRServerlessLogsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${Env}-miketriky-emr-logs-policy'
      Roles:
        - !Ref EMRServerlessExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudWatchLogsAccess
            Effect: Allow
            Action:
              - 'logs:CreateLogStream'
              - 'logs:CreateLogGroup'
              - 'logs:PutLogEvents'
              - 'logs:DescribeLogGroups'
              - 'logs:DescribeLogStreams'
            Resource:
              - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/emr-serverless/*'

Outputs:
  EMRServerlessExecutionRoleArn:
    Description: EMR Serverless Common Execution Role ARN
    Value: !GetAtt EMRServerlessExecutionRole.Arn
    Export:
      Name: !Sub '${Env}-miketriky-common-emr-serverless-role-arn'
  EMRServerlessExecutionRoleName:
    Description: EMR Serverless Common Execution Role Name
    Value: !Ref EMRServerlessExecutionRole
    Export:
      Name: !Sub '${Env}-miketriky-common-emr-serverless-role-name'
